# https://docs.spring.io/spring-boot/docs/current/reference/html/appendix-application-properties.html
spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    #
    # ${url}
    # MySQL Connector/J 8.0 Developer Guide | Connector/J Reference | Configuration Properties
    # https://dev.mysql.com/doc/connector-j/8.0/en/connector-j-reference-configuration-properties.html
    #
    # Testcontainers JDBC support
    # https://www.testcontainers.org/modules/databases/jdbc
    url: "jdbc:tc:mysqlext:9.2.0:////moname_addressing_jpa_test\
      ?cachePrepStmts=true\
      &cacheResultSetMetadata=true\
      &cacheServerConfiguration=true\
      &characterEncoding=UTF-8\
      &connectionCollation=utf8mb4_general_ci\
      &connectionTimeZone=UTC\
      &createDatabaseIfNotExist=true\
      &elideSetAutoCommits=true\
      &maintainTimeStats=false\
      &prepStmtCacheSize=256\
      &prepStmtCacheSqlLimit=2048\
      &rewriteBatchedStatements=true\
      &useLocalSessionState=true\
      &useServerPrepStmts=true\
      &TC_MEMORY=512MB\
      &TC_REUSABLE=true"
