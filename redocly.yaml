# See https://redocly.com/docs/cli/configuration/

apis:
  moname-commons-api:
    root: moname-commons/moname-commons-api/target/test-classes/openapi/specification.yaml

extends:
  - recommended

rules:
  # A sample custom rule. Read more about rules: https://redocly.com/docs/cli/rules/
  rule/operation-description:
    subject:
      type: Operation
      property: description
    assertions:
      defined: true
      minLength: 30

theme:
  openapi:
    generateCodeSamples:
      languages:
        - lang: curl
        - lang: Java
