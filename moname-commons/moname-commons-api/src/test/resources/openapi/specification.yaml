openapi: 3.1.0
info:
  title: @project.name@
  summary: &info-summary @project.description@
  description: *info-summary
  termsOfService: https://moname.kinlhp.com/api/terms
  contact:
    name: @project.organization.name@
    url: @project.organization.url@
    email: @developer.email@
    #^x-: # [This object MAY be extended with Specification Extensions.](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md#specification-extensions)
  license:
    name: @license.name@
    #identifier: MIT # attribute info.license.identifier is unexpected
    url: https://opensource.org/license/mit
    #^x-: # [This object MAY be extended with Specification Extensions.](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md#specification-extensions)
  version: @revision@
  #^x-: # [This object MAY be extended with Specification Extensions.](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md#specification-extensions)
#jsonSchemaDialect:
servers:
  - url: http://{host}:{port}/{basePath}
    description: The local development API server.
    variables:
      host:
        # NOTE! No enum here means it is an open value.
        enum:
          - &servers-variables-host localhost
        default: *servers-variables-host
        description: The server host.
        #^x-: # [This object MAY be extended with Specification Extensions.](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md#specification-extensions)
      port:
        # NOTE! No enum here means it is an open value.
        enum:
          - &servers-variables-port 8080
        default: *servers-variables-port
        description: The server port.
        #^x-: # [This object MAY be extended with Specification Extensions.](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md#specification-extensions)
      basePath:
        # NOTE! No enum here means it is an open value.
        #       Open meaning there is the opportunity to use special base paths
        #       as assigned by the provider, default is `api` in this case.
        enum:
          - &servers-variables-basePath api
        default: *servers-variables-basePath
        description: The API base path.
        #^x-: # [This object MAY be extended with Specification Extensions.](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md#specification-extensions)
    #^x-: # [This object MAY be extended with Specification Extensions.](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md#specification-extensions)
  - url: https://{host}
    description: The production API server.
    variables:
      host:
        # NOTE! No enum here means it is an open value.
        enum:
          - &servers-variables-host commons-api.moname.kinlhp.com
        default: *servers-variables-host
        description: The server host.
        #^x-: # [This object MAY be extended with Specification Extensions.](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md#specification-extensions)
    #^x-: # [This object MAY be extended with Specification Extensions.](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.1.0.md#specification-extensions)
