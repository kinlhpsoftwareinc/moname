# https://docs.liquibase.com/concepts/changelogs/working-with-changelogs.html
#
# https://docs.liquibase.com/concepts/changelogs/changelog-formats.html
#
# https://docs.liquibase.com/concepts/changelogs/yaml-format.html
#
# https://docs.liquibase.com/change-types/load-data.html
#
# https://www.liquibase.org/javadoc/liquibase/change/core/LoadDataChange.LOAD_DATA_TYPE.html
#
# https://docs.liquibase.com/concepts/changelogs/property-substitution.html
#
# https://docs.liquibase.com/concepts/changelogs/attributes/dbms.html
#
# https://docs.liquibase.com/change-types/sql.html
#
# ${databaseChangeLog[].changeSet.id}
# Pattern: ISO 8601 (e.g.: 1970-01-01T00:00:00+00:00)
#
# {@link spring.liquibase.parameters.* parameters}
# https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data-migration.spring.liquibase.parameters
#
# Learn | SQL | SQL Serve | SET IDENTITY_INSERT (Transact-SQL)
# https://learn.microsoft.com/en-us/sql/t-sql/statements/set-identity-insert-transact-sql
databaseChangeLog:
  - changeSet:
      author: kinlhp
      id: 2022-04-02T05:51:14-03:00
      changes:
        - sql:
            dbms: mssql
            sql: SET IDENTITY_INSERT ${table-name.read-only} ON
        - loadData:
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: description
                  type: STRING
            commentLineStartsWith: "#"
            encoding: ${encoding}
            file: ${table-name.read-only}.csv
            quotchar: '""'
            relativeToChangelogFile: true
            separator: ","
            tableName: ${table-name.read-only}
            usePreparedStatements: ${use-prepared-statements}
        - sql:
            dbms: mssql
            sql: SET IDENTITY_INSERT ${table-name.read-only} OFF
