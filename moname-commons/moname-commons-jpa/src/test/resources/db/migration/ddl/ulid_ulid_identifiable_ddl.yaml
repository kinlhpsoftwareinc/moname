# https://docs.liquibase.com/concepts/changelogs/working-with-changelogs.html
#
# https://docs.liquibase.com/concepts/changelogs/changelog-formats.html
#
# https://docs.liquibase.com/concepts/changelogs/yaml-format.html
#
# https://docs.liquibase.com/change-types/home.html
#
# https://docs.liquibase.com/change-types/create-table.html
#
# https://docs.liquibase.com/workflows/liquibase-community/modify-sql.html
#
# https://docs.liquibase.com/concepts/changelogs/preconditions.html
#
# https://docs.liquibase.com/concepts/changelogs/property-substitution.html
#
# https://docs.liquibase.com/concepts/changelogs/attributes/dbms.html
#
# ${databaseChangeLog[].changeSet.id}
# Pattern: ISO 8601 (e.g.: 1970-01-01T00:00:00+00:00)
#
# {@link java.sql.Types Types}
# https://stackoverflow.com/a/28626825
#
# {@link spring.liquibase.parameters.* parameters}
# https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data-migration.spring.liquibase.parameters
#
# MySQL 8.0 Reference Manual | Character Sets, Collations, Unicode | Specifying Character Sets and Collations | Database Character Set and Collation
# https://dev.mysql.com/doc/refman/8.0/en/charset-database.html
#
# Universally Unique Lexicographically Sortable Identifier (ULID)
# https://github.com/ulid/spec
databaseChangeLog:
  - changeSet:
      author: kinlhp
      id: 2024-06-05T00:41:31-03:02
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    notNullConstraintName: ulid_${table-name.ulid-identifiable}_id_nn
                    nullable: false
                    primaryKey: true
                    primaryKeyName: ulid_${table-name.ulid-identifiable}_pk
                  name: id
                  remarks: Universally Unique Lexicographically Sortable Identifier (ULID).
                  type: ${ulid-ulid-data-type}
              - column:
                  constraints:
                    notNullConstraintName: ulid_${table-name.ulid-identifiable}_discriminator_nn
                    nullable: false
                    unique: true
                    uniqueConstraintName: ulid_${table-name.ulid-identifiable}_discriminator_uk
                  name: discriminator
                  remarks: ULID discriminator of the registry.
                  type: ${discriminator-data-type}
            remarks: ULID identifiable entity test.
            tableName: ulid_${table-name.ulid-identifiable}
        - modifySql:
            dbms: mysql
            append:
              value: ENGINE=InnoDB DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: ulid_${table-name.ulid-identifiable}
  - property:
      dbms: oracle
      global: false
      name: discriminator-data-type
      value: VARCHAR2(19 CHAR)
  - property:
      dbms: '!oracle'
      global: false
      name: discriminator-data-type
      value: VARCHAR(19)
  - property:
      dbms: oracle
      global: false
      name: ulid-ulid-data-type
      value: RAW(16)
  - property:
      dbms: '!oracle'
      global: false
      name: ulid-ulid-data-type
      value: BINARY(16)
